<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Carta | FINO</title>

  <meta
    name="description"
    content="Carta completa de FINO Bar Café · Domingo F. Sarmiento 996 · Córdoba Capital.">


  <style>

    :root{
      --black:#080808;
      --orange:#e84317;
      --cream:#f5f1e8;
    }


    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }


    html{
      scroll-behavior:smooth;
      background:var(--black);
    }


    body{

      margin:0;

      background:var(--black);

      color:var(--cream);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x:hidden;

    }


    a{
      color:inherit;
      text-decoration:none;
    }



    /* =====================================
       BARRA SUPERIOR
    ===================================== */

    .top-nav{

      position:fixed;

      top:0;
      left:0;

      width:100%;
      height:64px;

      z-index:1000;

      display:flex;

      align-items:center;
      justify-content:space-between;

      padding:0 5%;

      background:rgba(0,0,0,.94);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      border-bottom:
        1px solid rgba(255,255,255,.08);

    }



    .logo{

      color:var(--orange);

      font-size:27px;

      font-weight:700;

      letter-spacing:.04em;

    }



    .nav-links{

      display:flex;

      align-items:center;

      gap:25px;

    }


    .nav-links a{

      font-size:12px;

      letter-spacing:.1em;

      text-transform:uppercase;

      transition:color .2s ease;

    }


    .nav-links a:hover{

      color:var(--orange);

    }


    .nav-links .active{

      color:var(--orange);

    }



    /* =====================================
       SELECTOR DE CATEGORÍAS
    ===================================== */

    .category-nav{

      position:fixed;

      top:64px;
      left:0;

      width:100%;

      z-index:999;

      background:rgba(8,8,8,.97);

      border-bottom:
        1px solid rgba(255,255,255,.10);

    }


    .category-inner{

      width:100%;

      display:flex;

      align-items:center;

      gap:9px;

      overflow-x:auto;

      padding:11px 5%;

      scrollbar-width:none;

      -webkit-overflow-scrolling:touch;

    }


    .category-inner::-webkit-scrollbar{

      display:none;

    }


    .category-inner a{

      flex:0 0 auto;

      padding:8px 14px;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius:999px;

      color:#d9d4cd;

      font-size:11px;

      letter-spacing:.06em;

      text-transform:uppercase;

      white-space:nowrap;

      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;

    }


    .category-inner a:hover{

      background:var(--orange);

      border-color:var(--orange);

      color:white;

    }


    .category-inner .inicio-carta{

      color:var(--orange);

      border-color:
        rgba(232,67,23,.6);

    }



    /* =====================================
       CARTA COMPLETA
    ===================================== */

    .menu{

      width:100%;

      padding-top:113px;

      background:#000;

    }



    .menu-page{

      width:min(100%,794px);

      margin:0 auto;

      padding:0;

      line-height:0;

      background:#000;

      scroll-margin-top:113px;

    }



    .menu-page img{

      display:block;

      width:100%;

      height:auto;

      margin:0;

      padding:0;

    }



    /* =====================================
       WHATSAPP
    ===================================== */

    .whatsapp{

      position:fixed;

      right:18px;
      bottom:18px;

      z-index:1200;

      display:inline-flex;

      align-items:center;
      justify-content:center;

      padding:13px 18px;

      border-radius:999px;

      background:#25D366;

      color:#fff;

      font-size:14px;

      font-weight:700;

      box-shadow:
        0 8px 25px rgba(0,0,0,.35);

    }



    /* =====================================
       CELULAR
    ===================================== */

    @media(max-width:700px){


      .top-nav{

        height:58px;

        padding:0 18px;

      }


      .logo{

        font-size:23px;

      }


      .nav-links{

        gap:16px;

      }


      .nav-links a{

        font-size:11px;

      }


      .category-nav{

        top:58px;

      }


      .category-inner{

        padding:
          10px 12px;

        gap:7px;

      }


      .category-inner a{

        padding:
          7px 12px;

        font-size:10px;

      }


      .menu{

        padding-top:105px;

      }


      .menu-page{

        width:100%;

        scroll-margin-top:105px;

      }


      .whatsapp{

        right:12px;

        bottom:12px;

        padding:12px 15px;

        font-size:13px;

      }

    }


  </style>

</head>



<body>



  <!-- =====================================
       NAVEGACIÓN PRINCIPAL
  ====================================== -->

  <nav class="top-nav">


    <a
      class="logo"
      href="index.html">

      FINO

    </a>



    <div class="nav-links">


      <a href="index.html">

        Inicio

      </a>


      <a
        href="carta.html"
        class="active">

        Carta

      </a>


    </div>


  </nav>



  <!-- =====================================
       SELECTOR DE SECCIONES
  ====================================== -->

  <nav
    class="category-nav"
    aria-label="Secciones de la carta">


    <div class="category-inner">


      <a
        class="inicio-carta"
        href="#portada">

        Inicio

      </a>


      <a href="#cafeteria">

        Cafetería

      </a>


      <a href="#cafe">

        Café

      </a>


      <a href="#entradas">

        Entradas

      </a>


      <a href="#tablas">

        Tablas

      </a>


      <a href="#cocina">

        Cocina

      </a>


      <a href="#pizzas">

        Pizzas

      </a>


      <a href="#bebidas">

        Bebidas

      </a>


      <a href="#cocktails">

        Cocktails

      </a>


      <a href="#destilados">

        Destilados

      </a>


      <a href="#vinos">

        Vinos

      </a>


      <a href="#happy-hour">

        Happy Hour

      </a>


    </div>


  </nav>



  <!-- =====================================
       WHATSAPP
  ====================================== -->

  <a
    class="whatsapp"
    href="https://wa.me/5493518762716"
    target="_blank"
    rel="noopener noreferrer">

    WhatsApp

  </a>



  <!-- =====================================
       CARTA FINO
  ====================================== -->

  <main
    class="menu"
    aria-label="Carta completa de FINO">



    <!-- 01 · PORTADA -->

    <section
      class="menu-page"
      id="portada">

      <img
        src="01-portada.png"
        alt="Portada del menú FINO"
        fetchpriority="high">

    </section>



    <!-- 02 · CAFETERÍA -->

    <section
      class="menu-page"
      id="cafeteria">

      <img
        src="02-cafeteria.png"
        alt="Cafetería FINO"
        loading="lazy">

    </section>



    <!-- 03 · CAFÉ -->

    <section
      class="menu-page"
      id="cafe">

      <img
        src="03-cafe.png"
        alt="Café FINO"
        loading="lazy">

    </section>



    <!-- 04 · ENTRADAS -->

    <section
      class="menu-page"
      id="entradas">

      <img
        src="04-entradas.png"
        alt="Entradas y papas FINO"
        loading="lazy">

    </section>



    <!-- 05 · LAS TABLAS -->

    <section
      class="menu-page"
      id="tablas">

      <img
        src="05-tablas.png"
        alt="Las tablas FINO"
        loading="lazy">

    </section>



    <!-- 06 · COCINA -->

    <section
      class="menu-page"
      id="cocina">

      <img
        src="06-cocina.png"
        alt="Cocina FINO"
        loading="lazy">

    </section>



    <!-- 07 · PIZZAS Y POSTRES -->

    <section
      class="menu-page"
      id="pizzas">

      <img
        src="07-pizzas-postres.png"
        alt="Pizzas y postres FINO"
        loading="lazy">

    </section>



    <!-- 08 · BEBIDAS -->

    <section
      class="menu-page"
      id="bebidas">

      <img
        src="08-bebidas.png"
        alt="Bebidas, refrescos y cervezas FINO"
        loading="lazy">

    </section>



    <!-- 09 · COCKTAILS -->

    <section
      class="menu-page"
      id="cocktails">

      <img
        src="09-cocktails.png"
        alt="Cocktails FINO"
        loading="lazy">

    </section>



    <!-- 10 · DESTILADOS -->

    <section
      class="menu-page"
      id="destilados">

      <img
        src="10-destilados.png"
        alt="Destilados FINO"
        loading="lazy">

    </section>



    <!-- 11 · VINOS -->

    <section
      class="menu-page"
      id="vinos">

      <img
        src="11-vinos.png"
        alt="Vinos FINO"
        loading="lazy">

    </section>



    <!-- 12 · HAPPY HOUR -->

    <section
      class="menu-page"
      id="happy-hour">

      <img
        src="12-happy-hour.png"
        alt="Happy Hour FINO"
        loading="lazy">

    </section>



    <!-- 13 · FINAL / QR -->

    <section
      class="menu-page"
      id="final">

      <img
        src="13-final-qr.png"
        alt="FINO Bar Café Instagram finobarcafe"
        loading="lazy">

    </section>



  </main>


</body>

</html>
