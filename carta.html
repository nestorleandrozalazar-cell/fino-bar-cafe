<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carta | FINO</title>

  <meta
    name="description"
    content="Carta completa de FINO Bar Café · Domingo F. Sarmiento 996 · Córdoba Capital.">

  <style>

    :root{
      --black:#080808;
      --orange:#e84317;
      --cream:#f5f1e8;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
      background:var(--black);
    }

    body{
      margin:0;
      background:var(--black);
      color:var(--cream);
      font-family:Arial,Helvetica,sans-serif;
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }


    /* =========================
       MENÚ SUPERIOR
    ========================= */

    .top-nav{

      position:fixed;

      top:0;
      left:0;

      width:100%;
      height:64px;

      z-index:1000;

      display:flex;

      align-items:center;
      justify-content:space-between;

      padding:0 5%;

      background:rgba(0,0,0,.94);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      border-bottom:1px solid rgba(255,255,255,.08);

    }


    .logo{

      color:var(--orange);

      font-size:27px;

      font-weight:700;

      letter-spacing:.04em;

    }


    .nav-links{

      display:flex;

      align-items:center;

      gap:25px;

    }


    .nav-links a{

      font-size:12px;

      letter-spacing:.1em;

      text-transform:uppercase;

    }


    .nav-links .active{

      color:var(--orange);

    }



    /* =========================
       CARTA
    ========================= */

    .menu{

      width:100%;

      padding-top:64px;

      background:#000;

    }


    .menu-page{

      width:min(100%,794px);

      margin:0 auto;

      line-height:0;

      background:#000;

    }


    .menu-page img{

      display:block;

      width:100%;

      height:auto;

    }



    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp{

      position:fixed;

      right:18px;
      bottom:18px;

      z-index:1200;

      display:inline-flex;

      align-items:center;
      justify-content:center;

      padding:13px 18px;

      border-radius:999px;

      background:#25D366;

      color:#fff;

      font-size:14px;

      font-weight:700;

      box-shadow:0 8px 25px rgba(0,0,0,.35);

    }



    /* =========================
       CELULAR
    ========================= */

    @media(max-width:700px){

      .top-nav{

        height:58px;

        padding:0 18px;

      }


      .logo{

        font-size:23px;

      }


      .nav-links{

        gap:16px;

      }


      .nav-links a{

        font-size:11px;

      }


      .menu{

        padding-top:58px;

      }


      .menu-page{

        width:100%;

      }


      .whatsapp{

        right:12px;

        bottom:12px;

        padding:12px 15px;

        font-size:13px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVEGACIÓN
  ========================= -->

  <nav class="top-nav">

    <a
      class="logo"
      href="index.html">
      FINO
    </a>


    <div class="nav-links">

      <a href="index.html">
        Inicio
      </a>

      <a
        href="carta.html"
        class="active">
        Carta
      </a>

    </div>

  </nav>



  <!-- =========================
       WHATSAPP
  ========================= -->

  <a
    class="whatsapp"
    href="https://wa.me/5493518762716"
    target="_blank"
    rel="noopener noreferrer">

    WhatsApp

  </a>



  <!-- =========================
       CARTA COMPLETA
  ========================= -->

  <main
    class="menu"
    aria-label="Carta completa de FINO">


    <!-- 01 · PORTADA -->

    <section class="menu-page">

      <img
        src="menu/01-portada.png"
        alt="Portada del menú FINO"
        fetchpriority="high">

    </section>



    <!-- 02 · CAFETERÍA -->

    <section class="menu-page">

      <img
        src="menu/02-cafeteria.png"
        alt="Cafetería FINO"
        loading="lazy">

    </section>



    <!-- 03 · CAFÉ -->

    <section class="menu-page">

      <img
        src="menu/03-cafe.png"
        alt="Café FINO"
        loading="lazy">

    </section>



    <!-- 04 · ENTRADAS -->

    <section class="menu-page">

      <img
        src="menu/04-entradas.png"
        alt="Entradas FINO"
        loading="lazy">

    </section>



    <!-- 05 · LAS TABLAS -->

    <section class="menu-page">

      <img
        src="menu/05-tablas.png"
        alt="Las tablas FINO"
        loading="lazy">

    </section>



    <!-- 06 · COCINA -->

    <section class="menu-page">

      <img
        src="menu/06-cocina.png"
        alt="Cocina FINO"
        loading="lazy">

    </section>



    <!-- 07 · PIZZAS Y POSTRES -->

    <section class="menu-page">

      <img
        src="menu/07-pizzas-postres.png"
        alt="Pizzas y postres FINO"
        loading="lazy">

    </section>



    <!-- 08 · BEBIDAS -->

    <section class="menu-page">

      <img
        src="menu/08-bebidas.png"
        alt="Bebidas FINO"
        loading="lazy">

    </section>



    <!-- 09 · COCKTAILS -->

    <section class="menu-page">

      <img
        src="menu/09-cocktails.png"
        alt="Cocktails FINO"
        loading="lazy">

    </section>



    <!-- 10 · DESTILADOS -->

    <section class="menu-page">

      <img
        src="menu/10-destilados.png"
        alt="Destilados FINO"
        loading="lazy">

    </section>



    <!-- 11 · VINOS -->

    <section class="menu-page">

      <img
        src="menu/11-vinos.png"
        alt="Vinos FINO"
        loading="lazy">

    </section>



    <!-- 12 · HAPPY HOUR -->

    <section class="menu-page">

      <img
        src="menu/12-happy-hour.png"
        alt="Happy Hour FINO"
        loading="lazy">

    </section>



    <!-- 13 · FINAL -->

    <section class="menu-page">

      <img
        src="menu/13-final-qr.png"
        alt="FINO Bar Café · Instagram @finobarcafe"
        loading="lazy">

    </section>


  </main>


</body>
</html>
